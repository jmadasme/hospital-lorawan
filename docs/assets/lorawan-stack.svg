<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 820" width="1240" height="820" role="img" aria-labelledby="title desc">
  <title id="title">Pila LoRaWAN de referencia</title>
  <desc id="desc">Capas de una red LoRaWAN: dispositivo final, gateway, servidor de red, servidores de join y aplicación, integraciones MQTT o webhook y dashboard. Incluye números operativos de duty cycle y payload.</desc>
  <defs>
    <marker id="ls-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A9D8F"/>
    </marker>
    <marker id="ls-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#457B9D"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="820" fill="#06141b"/>

  <text x="40" y="50" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="26" font-weight="bold" fill="#e8eef2">Pila LoRaWAN de referencia</text>
  <text x="40" y="76" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="13" fill="#9db2bd">Qué simula la versión 1.0.0 y qué falta para conectar sensores reales</text>

  <!-- Etiquetas de capa -->
  <g font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#5B7C99">
    <text x="40" y="134">FÍSICA</text>
    <text x="40" y="234">RADIO</text>
    <text x="40" y="334">RED</text>
    <text x="40" y="434">APLICACIÓN</text>
    <text x="40" y="534">INTEGRACIÓN</text>
    <text x="40" y="634">VISUALIZACIÓN</text>
  </g>

  <!-- 1 End device -->
  <rect x="120" y="104" width="760" height="70" rx="10" fill="#0f2a34" stroke="#2f5a6b"/>
  <text x="140" y="132" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#e8eef2">Dispositivo final · nodo sensor</text>
  <text x="140" y="152" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11.5" fill="#9db2bd">DS18B20 / SHT31 · MCU · radio LoRa · Clase A · OTAA</text>
  <text x="860" y="143" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99" text-anchor="end">1 por punto de frío</text>

  <line x1="500" y1="174" x2="500" y2="196" stroke="#2A9D8F" stroke-width="2" marker-end="url(#ls-teal)"/>
  <text x="512" y="190" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99">RF sub-GHz · 868 / 915 MHz</text>

  <!-- 2 Gateway -->
  <rect x="120" y="200" width="760" height="70" rx="10" fill="#0f2a34" stroke="#2f5a6b"/>
  <text x="140" y="228" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#e8eef2">Gateway</text>
  <text x="140" y="248" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11.5" fill="#9db2bd">SX1301 / SX1302 · multi-canal · reenvía tramas por IP, no decide</text>
  <text x="860" y="239" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99" text-anchor="end">1 por edificio o ala</text>

  <line x1="500" y1="270" x2="500" y2="292" stroke="#2A9D8F" stroke-width="2" marker-end="url(#ls-teal)"/>
  <text x="512" y="286" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99">IP · backhaul</text>

  <!-- 3 Network server -->
  <rect x="120" y="296" width="760" height="70" rx="10" fill="#0f2a34" stroke="#2f5a6b"/>
  <text x="140" y="324" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#e8eef2">Network Server</text>
  <text x="140" y="344" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11.5" fill="#9db2bd">deduplicación · MIC · frame counters · ADR · duty cycle</text>
  <text x="860" y="335" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99" text-anchor="end">TTN · ChirpStack</text>

  <line x1="500" y1="366" x2="500" y2="388" stroke="#2A9D8F" stroke-width="2" marker-end="url(#ls-teal)"/>
  <text x="512" y="382" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99">API · join server</text>

  <!-- 4 Application server -->
  <rect x="120" y="392" width="760" height="70" rx="10" fill="#0f2a34" stroke="#2f5a6b"/>
  <text x="140" y="420" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#e8eef2">Join Server + Application Server</text>
  <text x="140" y="440" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11.5" fill="#9db2bd">OTAA · descifra el payload · ejecuta el decoder de la aplicación</text>
  <text x="860" y="431" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99" text-anchor="end">AppKey fuera del repo</text>

  <line x1="500" y1="462" x2="500" y2="484" stroke="#2A9D8F" stroke-width="2" marker-end="url(#ls-teal)"/>
  <text x="512" y="478" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99">MQTT TLS 8883 / webhook HTTPS</text>

  <!-- 5 Integración -->
  <rect x="120" y="488" width="760" height="70" rx="10" fill="#0f2a34" stroke="#457B9D"/>
  <text x="140" y="516" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#e8eef2">Integración · bridge de ingestión</text>
  <text x="140" y="536" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11.5" fill="#9db2bd">mapea DevEUI → device_id · deduplica f_cnt · valida token</text>
  <text x="860" y="527" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99" text-anchor="end">no implementado en 1.0.0</text>

  <line x1="500" y1="558" x2="500" y2="580" stroke="#457B9D" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#ls-blue)"/>
  <text x="512" y="574" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99">INSERT idempotente</text>

  <!-- 6 Dashboard -->
  <rect x="120" y="584" width="760" height="86" rx="10" fill="#113b39" stroke="#2A9D8F" stroke-width="1.5"/>
  <text x="140" y="612" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#2A9D8F">Dashboard Flask + SQLite</text>
  <text x="140" y="632" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11.5" fill="#e8eef2">Implementado en 1.0.0 con generador mock: 200 dispositivos, ronda cada 30 s.</text>
  <text x="140" y="652" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#9db2bd">Sin watchdog de silencio, sin batería/RSSI y sin cierre de alertas.</text>

  <!-- Panel lateral -->
  <rect x="920" y="104" width="280" height="300" rx="12" fill="#0b1f28" stroke="#3a5f70"/>
  <text x="940" y="132" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#e8eef2">Números que importan</text>
  <g font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11.5" fill="#9db2bd">
    <text x="940" y="158">Duty cycle 868 MHz: ~1 %</text>
    <text x="940" y="180">Dwell time 915 MHz: 400 ms</text>
    <text x="940" y="202">Payload útil: 3–5 bytes</text>
    <text x="940" y="224">Máximo habitual: 51 bytes</text>
    <text x="940" y="246">Reporte realista: 5–15 min</text>
    <text x="940" y="268">Alcance urbano: 2–5 km</text>
    <text x="940" y="290">Alcance interior: 1–3 pisos</text>
    <text x="940" y="312">Clase A: 2 ventanas RX</text>
  </g>
  <line x1="940" y1="328" x2="1180" y2="328" stroke="#244b5a"/>
  <text x="940" y="350" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10.5" fill="#5B7C99">Cifras típicas, no garantías:</text>
  <text x="940" y="368" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10.5" fill="#5B7C99">dependen de región, SF y entorno.</text>

  <rect x="920" y="424" width="280" height="184" rx="12" fill="#0b1f28" stroke="#3a5f70"/>
  <text x="940" y="452" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="13" font-weight="bold" fill="#e8eef2">Errores de diseño frecuentes</text>
  <g font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#9db2bd">
    <text x="940" y="478">· Confundir «sin datos» con «todo bien»</text>
    <text x="940" y="500">· Umbral sin histéresis ni persistencia</text>
    <text x="940" y="522">· Un gateway como única cobertura</text>
    <text x="940" y="544">· Credenciales en el repositorio</text>
    <text x="940" y="566">· Asumir tiempo real en LoRa</text>
    <text x="940" y="588">· No deduplicar uplinks (QoS 1)</text>
  </g>

  <rect x="920" y="628" width="280" height="42" rx="8" fill="#113b39" stroke="#2A9D8F"/>
  <text x="934" y="654" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10.5" fill="#c7d6dd">1.0.0: solo la capa de aplicación, con datos mock.</text>

  <text x="40" y="720" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#5B7C99">Una red LoRaWAN no transporta «tiempo real»: transporta telemetría periódica. El diseño del dashboard debe asumirlo.</text>
  <text x="40" y="744" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#5B7C99">Las claves de aplicación y las credenciales de operador se configuran fuera del repositorio.</text>
</svg>
