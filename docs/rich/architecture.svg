<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 860" width="1240" height="860" role="img" aria-labelledby="title desc">
  <title id="title">Arquitectura de Hospital LoRaWAN Monitor</title>
  <desc id="desc">Diagrama de la arquitectura 1.0.0: cadena LoRaWAN prevista, aplicación Flask con generador mock, base SQLite y navegador con polling cada 10 segundos.</desc>
  <defs>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#2A9D8F"/>
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#457B9D"/>
    </marker>
    <marker id="arrow-muted" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#5B7C99"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1240" height="860" fill="#06141b"/>

  <text x="40" y="52" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="28" font-weight="bold" fill="#e8eef2">Hospital LoRaWAN Monitor — arquitectura</text>
  <text x="40" y="78" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="13" fill="#9db2bd">Versión 1.0.0 · datos simulados dentro del proceso Flask · ingestión LoRaWAN prevista, no implementada</text>

  <line x1="880" y1="50" x2="920" y2="50" stroke="#2A9D8F" stroke-width="3"/>
  <text x="928" y="54" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="12" fill="#9db2bd">implementado</text>
  <line x1="1035" y1="50" x2="1075" y2="50" stroke="#5B7C99" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="1083" y="54" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="12" fill="#9db2bd">previsto</text>

  <!-- Campo LoRaWAN -->
  <rect x="40" y="104" width="1160" height="150" rx="14" fill="#0b1f28" stroke="#22414e" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="60" y="130" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="12" letter-spacing="1" fill="#5B7C99">CAMPO LoRaWAN · PREVISTO, NO IMPLEMENTADO EN 1.0.0</text>

  <g font-family="'DejaVu Sans','Segoe UI',sans-serif">
    <rect x="60" y="148" width="200" height="88" rx="10" fill="#0f2a34" stroke="#2f5a6b"/>
    <text x="76" y="176" font-size="14" font-weight="bold" fill="#e8eef2">Nodo sensor</text>
    <text x="76" y="198" font-size="11" fill="#9db2bd">DS18B20 · SHT31</text>
    <text x="76" y="216" font-size="10" fill="#5B7C99">Clase A · OTAA</text>

    <rect x="290" y="148" width="200" height="88" rx="10" fill="#0f2a34" stroke="#2f5a6b"/>
    <text x="306" y="176" font-size="14" font-weight="bold" fill="#e8eef2">Gateway</text>
    <text x="306" y="198" font-size="11" fill="#9db2bd">SX1302 · 8 canales</text>
    <text x="306" y="216" font-size="10" fill="#5B7C99">solo reenvía por IP</text>

    <rect x="520" y="148" width="200" height="88" rx="10" fill="#0f2a34" stroke="#2f5a6b"/>
    <text x="536" y="176" font-size="14" font-weight="bold" fill="#e8eef2">Network Server</text>
    <text x="536" y="198" font-size="11" fill="#9db2bd">dedup · MIC · f_cnt</text>
    <text x="536" y="216" font-size="10" fill="#5B7C99">TTN · ChirpStack</text>

    <rect x="750" y="148" width="200" height="88" rx="10" fill="#0f2a34" stroke="#2f5a6b"/>
    <text x="766" y="176" font-size="14" font-weight="bold" fill="#e8eef2">Application Server</text>
    <text x="766" y="198" font-size="11" fill="#9db2bd">descifra el payload</text>
    <text x="766" y="216" font-size="10" fill="#5B7C99">decoder JS</text>

    <rect x="980" y="148" width="200" height="88" rx="10" fill="#0f2a34" stroke="#5B7C99" stroke-dasharray="5 4"/>
    <text x="996" y="176" font-size="14" font-weight="bold" fill="#e8eef2">Bridge de ingestión</text>
    <text x="996" y="198" font-size="11" fill="#9db2bd">MQTT · webhook HTTPS</text>
    <text x="996" y="216" font-size="10" fill="#5B7C99">mapea DevEUI → id</text>
  </g>

  <line x1="260" y1="192" x2="286" y2="192" stroke="#457B9D" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="490" y1="192" x2="516" y2="192" stroke="#457B9D" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="720" y1="192" x2="746" y2="192" stroke="#457B9D" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <line x1="950" y1="192" x2="976" y2="192" stroke="#457B9D" stroke-width="2" marker-end="url(#arrow-blue)"/>

  <line x1="1080" y1="236" x2="1080" y2="296" stroke="#5B7C99" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrow-muted)"/>
  <text x="1090" y="272" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#5B7C99">INSERT previsto</text>

  <!-- Aplicación Flask -->
  <rect x="40" y="290" width="640" height="320" rx="14" fill="#0d2531" stroke="#2A9D8F" stroke-width="2"/>
  <text x="60" y="320" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="16" font-weight="bold" fill="#2A9D8F">Aplicación Flask · un solo proceso</text>
  <text x="60" y="340" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#9db2bd">initialize() → tablas + seed de 200 dispositivos + hilo generador</text>

  <g font-family="'DejaVu Sans','Segoe UI',sans-serif">
    <rect x="60" y="352" width="600" height="36" rx="8" fill="#102f3a" stroke="#244b5a"/>
    <text x="76" y="375" font-size="12.5"><tspan font-weight="bold" fill="#2A9D8F">app.py</tspan><tspan fill="#c7d6dd" dx="5">— crea la app, CORS global, rutas / y /health</tspan></text>

    <rect x="60" y="394" width="600" height="36" rx="8" fill="#102f3a" stroke="#244b5a"/>
    <text x="76" y="417" font-size="12.5"><tspan font-weight="bold" fill="#2A9D8F">routes.py</tspan><tspan fill="#c7d6dd" dx="5">— blueprint api_bp · 8 rutas de API + /health</tspan></text>

    <rect x="60" y="436" width="600" height="36" rx="8" fill="#113b39" stroke="#2A9D8F"/>
    <text x="76" y="459" font-size="12.5"><tspan font-weight="bold" fill="#2A9D8F">data_generator.py</tspan><tspan fill="#c7d6dd" dx="5">— hilo daemon · 200 lecturas cada 30 s</tspan></text>

    <rect x="60" y="478" width="600" height="36" rx="8" fill="#102f3a" stroke="#244b5a"/>
    <text x="76" y="501" font-size="12.5"><tspan font-weight="bold" fill="#2A9D8F">database.py</tspan><tspan fill="#c7d6dd" dx="5">— conexión, DDL, seed, consultas, WAL</tspan></text>

    <rect x="60" y="520" width="600" height="36" rx="8" fill="#102f3a" stroke="#244b5a"/>
    <text x="76" y="543" font-size="12.5"><tspan font-weight="bold" fill="#2A9D8F">models.py</tspan><tspan fill="#c7d6dd" dx="5">— Device · Reading · Alert (dataclasses)</tspan></text>

    <rect x="60" y="562" width="600" height="36" rx="8" fill="#102f3a" stroke="#244b5a"/>
    <text x="76" y="585" font-size="12.5"><tspan font-weight="bold" fill="#2A9D8F">templates/ + static/</tspan><tspan fill="#c7d6dd" dx="5">— dashboard, CSS y polling en JS</tspan></text>
  </g>

  <!-- SQLite -->
  <rect x="940" y="300" width="240" height="110" rx="12" fill="#0b1f28" stroke="#457B9D" stroke-width="1.5"/>
  <text x="960" y="328" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="16" font-weight="bold" fill="#457B9D">SQLite</text>
  <text x="960" y="350" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11.5" fill="#e8eef2">hospital_lorawan.db</text>
  <text x="960" y="368" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#9db2bd">WAL · foreign_keys · 5 índices</text>
  <text x="960" y="386" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#9db2bd">3 tablas · sin migraciones</text>

  <line x1="680" y1="356" x2="936" y2="356" stroke="#2A9D8F" stroke-width="2" marker-end="url(#arrow-teal)"/>
  <text x="808" y="346" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" text-anchor="middle" fill="#9db2bd">sqlite3 · consultas</text>

  <!-- Generador mock -->
  <rect x="700" y="440" width="480" height="170" rx="14" fill="#0b1f28" stroke="#3a5f70"/>
  <text x="720" y="468" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="14" font-weight="bold" fill="#e8eef2">Generador de datos mock</text>
  <g font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="12" fill="#9db2bd">
    <text x="720" y="494">200 dispositivos · 11 tipos</text>
    <text x="720" y="518">1 ronda completa cada 30 s</text>
    <text x="720" y="542">10 % de lecturas fuera de rango</text>
    <text x="720" y="566">severidad warning / critical</text>
    <text x="720" y="590">alertas sin cierre automático</text>
  </g>

  <!-- Navegador -->
  <rect x="40" y="650" width="640" height="160" rx="14" fill="#0d2531" stroke="#457B9D" stroke-width="1.5"/>
  <text x="60" y="678" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="15" font-weight="bold" fill="#457B9D">Navegador · dashboard</text>
  <text x="60" y="697" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#9db2bd">HTML + JS vanilla · Chart.js 4.4.1 por CDN</text>

  <g font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="10" fill="#c7d6dd">
    <rect x="60" y="710" width="110" height="34" rx="6" fill="#102f3a" stroke="#244b5a"/>
    <text x="70" y="731">Total 200</text>
    <rect x="180" y="710" width="110" height="34" rx="6" fill="#102f3a" stroke="#244b5a"/>
    <text x="190" y="731">OK 163</text>
    <rect x="300" y="710" width="110" height="34" rx="6" fill="#102f3a" stroke="#244b5a"/>
    <text x="310" y="731">Alertas 37</text>
    <rect x="420" y="710" width="110" height="34" rx="6" fill="#102f3a" stroke="#244b5a"/>
    <text x="430" y="731">Lecturas 184k</text>
  </g>

  <text x="60" y="775" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#9db2bd">Tendencia: 60 puntos por dispositivo</text>
  <polyline points="360,792 400,780 440,786 480,768 520,774 560,758 600,764 620,752" fill="none" stroke="#2A9D8F" stroke-width="2.5" stroke-linejoin="round"/>

  <line x1="360" y1="610" x2="360" y2="646" stroke="#457B9D" stroke-width="2" marker-start="url(#arrow-blue)" marker-end="url(#arrow-blue)"/>
  <text x="372" y="634" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#9db2bd">HTTP · polling cada 10 s</text>

  <text x="700" y="665" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="12" fill="#9db2bd">Los valores que muestra el dashboard son sintéticos.</text>
  <text x="700" y="690" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#5B7C99">Línea continua: camino implementado · discontinua: camino previsto.</text>
  <text x="700" y="715" font-family="'DejaVu Sans','Segoe UI',sans-serif" font-size="11" fill="#5B7C99">No hay sensores físicos conectados en esta versión.</text>
</svg>
